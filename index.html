<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Alley - Canvas</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 10%, #151a3a, #05060f 60%, #020205 100%);
        font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hint {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: rgba(220, 230, 255, 0.65);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-shadow: 0 0 6px rgba(120, 160, 255, 0.35);
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="hint">CYBERPUNK RAINY ALLEY · HTML CANVAS</div>

    <script>
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      let width = 0;
      let height = 0;
      let horizonY = 0;
      let vanishingX = 0;
      const raindrops = [];
      const neonSigns = [];

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

        horizonY = height * 0.42;
        vanishingX = width * 0.5;

        setupRain();
        setupSigns();
      }

      function setupRain() {
        raindrops.length = 0;
        const count = Math.floor((width * height) / 5200);
        for (let i = 0; i < count; i += 1) {
          raindrops.push(createDrop(true));
        }
      }

      function createDrop(initial = false) {
        const depth = Math.random();
        const speed = 4 + depth * 14;
        return {
          x: Math.random() * width,
          y: initial ? Math.random() * height : -20,
          len: 8 + depth * 18,
          speed,
          drift: 0.35 + depth * 0.45,
          alpha: 0.2 + depth * 0.55,
        };
      }

      function setupSigns() {
        neonSigns.length = 0;
        const colors = ["#ff2ea6", "#14f1ff", "#ffd74f", "#8b6dff", "#35ff86"];
        const labels = ["BAR", "VR", "NET", "SYNTH", "NOVA", "RAMEN", "XR"];

        for (let i = 0; i < 10; i += 1) {
          const side = i % 2 === 0 ? "left" : "right";
          const d = 0.18 + Math.random() * 0.72;
          const y = horizonY + d * (height - horizonY - 40);
          const baseSize = (1 - d) * 36 + 10;
          const x = side === "left"
            ? width * (0.14 + d * 0.15)
            : width * (0.86 - d * 0.15);

          neonSigns.push({
            side,
            d,
            x,
            y,
            w: baseSize * (1.2 + Math.random() * 1.1),
            h: baseSize * (0.52 + Math.random() * 0.45),
            color: colors[(Math.random() * colors.length) | 0],
            label: labels[(Math.random() * labels.length) | 0],
            blink: Math.random() * Math.PI * 2,
          });
        }
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#080b1f");
        sky.addColorStop(0.42, "#15183a");
        sky.addColorStop(1, "#030309");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < 90; i += 1) {
          const sx = Math.random() * width;
          const sy = Math.random() * horizonY * 0.9;
          const s = Math.random() * 1.8;
          ctx.fillStyle = `rgba(150, 190, 255, ${Math.random() * 0.3})`;
          ctx.fillRect(sx, sy, s, s);
        }
      }

      function drawBuildings() {
        const streetTopWidth = width * 0.08;
        const leftTop = vanishingX - streetTopWidth;
        const rightTop = vanishingX + streetTopWidth;

        const leftWall = ctx.createLinearGradient(0, 0, width * 0.4, 0);
        leftWall.addColorStop(0, "#020306");
        leftWall.addColorStop(1, "#12152d");
        ctx.fillStyle = leftWall;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(leftTop, horizonY);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        const rightWall = ctx.createLinearGradient(width, 0, width * 0.6, 0);
        rightWall.addColorStop(0, "#020306");
        rightWall.addColorStop(1, "#12152d");
        ctx.fillStyle = rightWall;
        ctx.beginPath();
        ctx.moveTo(width, 0);
        ctx.lineTo(rightTop, horizonY);
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fill();

        for (let i = 0; i < 26; i += 1) {
          const t = i / 26;
          const y = lerp(0, horizonY, t * t);
          const lx = lerp(0, leftTop, t);
          const rx = lerp(width, rightTop, t);

          ctx.strokeStyle = `rgba(70, 90, 140, ${0.03 + 0.08 * (1 - t)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(lx, y);
          ctx.lineTo(lx, height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(rx, y);
          ctx.lineTo(rx, height);
          ctx.stroke();
        }
      }

      function drawStreet(time) {
        const topWidth = width * 0.09;
        const leftTop = vanishingX - topWidth;
        const rightTop = vanishingX + topWidth;

        const roadGrad = ctx.createLinearGradient(0, horizonY, 0, height);
        roadGrad.addColorStop(0, "#0e1025");
        roadGrad.addColorStop(1, "#090a13");
        ctx.fillStyle = roadGrad;

        ctx.beginPath();
        ctx.moveTo(leftTop, horizonY);
        ctx.lineTo(rightTop, horizonY);
        ctx.lineTo(width * 0.86, height);
        ctx.lineTo(width * 0.14, height);
        ctx.closePath();
        ctx.fill();

        for (let i = 0; i < 16; i += 1) {
          const t = i / 15;
          const y = lerp(horizonY, height, t * t);
          const xl = lerp(leftTop, width * 0.14, t);
          const xr = lerp(rightTop, width * 0.86, t);

          ctx.strokeStyle = `rgba(90, 120, 190, ${0.03 + 0.16 * t})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(xl, y);
          ctx.lineTo(xr, y);
          ctx.stroke();
        }

        const pulse = 0.5 + Math.sin(time * 0.003) * 0.15;
        ctx.strokeStyle = `rgba(20, 241, 255, ${pulse})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([24, 16]);
        ctx.beginPath();
        ctx.moveTo(vanishingX, horizonY + 4);
        ctx.lineTo(vanishingX, height);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawNeonSigns(time) {
        for (const sign of neonSigns) {
          const flicker = 0.65 + 0.35 * Math.sin(time * 0.006 + sign.blink);
          const glow = sign.h * 0.8;

          ctx.save();
          ctx.fillStyle = sign.color;
          ctx.shadowBlur = glow;
          ctx.shadowColor = sign.color;
          ctx.globalAlpha = flicker;

          const offset = sign.side === "left" ? -sign.w * 0.5 : -sign.w * 0.5;
          ctx.fillRect(sign.x + offset, sign.y, sign.w, sign.h);

          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(8, 10, 20, 0.6)";
          ctx.lineWidth = 2;
          ctx.strokeRect(sign.x + offset, sign.y, sign.w, sign.h);

          ctx.fillStyle = "rgba(240, 250, 255, 0.9)";
          ctx.font = `${Math.max(10, sign.h * 0.62)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(sign.label, sign.x, sign.y + sign.h * 0.52);
          ctx.restore();

          ctx.beginPath();
          ctx.strokeStyle = "rgba(180, 200, 255, 0.14)";
          ctx.lineWidth = 1;
          ctx.moveTo(sign.x, sign.y + sign.h);
          ctx.lineTo(sign.x, sign.y + sign.h + 18 + sign.d * 26);
          ctx.stroke();
        }
      }

      function drawRain() {
        for (let i = 0; i < raindrops.length; i += 1) {
          const drop = raindrops[i];
          ctx.strokeStyle = `rgba(150, 205, 255, ${drop.alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - drop.drift * 2.2, drop.y + drop.len);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= drop.drift;

          if (drop.y > height + 20 || drop.x < -30) {
            raindrops[i] = createDrop();
            raindrops[i].x = Math.random() * (width + 40) + 20;
          }
        }
      }

      function drawReflections(time) {
        const puddles = 7;
        for (let i = 0; i < puddles; i += 1) {
          const t = i / (puddles - 1);
          const y = lerp(horizonY + 40, height - 30, t * t);
          const w = lerp(16, width * 0.42, t);
          const x = vanishingX + Math.sin(time * 0.0018 + i * 0.9) * 18;

          const g = ctx.createRadialGradient(x, y, 2, x, y, w);
          g.addColorStop(0, "rgba(45, 250, 255, 0.2)");
          g.addColorStop(0.45, "rgba(255, 70, 190, 0.14)");
          g.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(x, y, w, 12 + t * 10, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function frame(time) {
        drawBackground();
        drawBuildings();
        drawStreet(time);
        drawNeonSigns(time);
        drawReflections(time);
        drawRain();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
